[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "heel-sim"
version = "1.2.0"
description = "Privacy-first local SaaS launch review for browser, CLI, and MCP workflows."
readme = "release/open-core/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ancilis" }]
keywords = ["security", "abuse-simulation", "mcp", "red-team", "agent", "appsec", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# v1 core is PURE STANDARD LIBRARY by design (DECISIONS D-001) — zero runtime dependencies.
dependencies = []

[project.scripts]
heel = "heel.cli:main"
heel-mcp = "heel.mcp_server:main"
heel-rest = "heel.rest:serve"

[project.optional-dependencies]
runner = ["cryptography==45.0.7"]

[tool.setuptools]
include-package-data = false
packages = ["heel"]

[tool.setuptools.package-data]
heel = ["heldout/targets.json", "scenarios_lib/community.json"]
