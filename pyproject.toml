[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heel-sim"
version = "1.1.0"
description = "Privacy-first local SaaS launch review for browser, CLI, and MCP workflows."
readme = "release/open-core/README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ancilis" }]
keywords = ["security", "abuse-simulation", "mcp", "red-team", "agent", "appsec", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# v1 core is PURE STANDARD LIBRARY by design (DECISIONS D-001) — zero runtime dependencies.
dependencies = []

[project.optional-dependencies]
# the LLM control loop uses the Anthropic Messages API via stdlib urllib (no SDK needed);
# this extra is only a convenience marker — no package is actually required.
llm = []

[project.scripts]
heel = "heel.cli:main"
heel-mcp = "heel.mcp_server:main"
heel-rest = "heel.rest:serve"

[tool.setuptools]
include-package-data = false
license-files = ["LICENSE", "NOTICE"]
packages = ["heel"]

[tool.setuptools.package-data]
heel = ["heldout/targets.json", "scenarios_lib/community.json"]
