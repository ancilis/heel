name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Acceptance + safety tests (pure stdlib — no install needed)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: One-command demo (auth gate + honest backtests)
        run: python run_demo.py
      - name: Hosted control-plane smoke (signup → run → verify → kill switch)
        run: python scripts/saas_smoke.py
      - name: Static site build
        run: python -c "from heel.saas.site import build; build('build/site')"

  package:
    name: build + install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build wheel + sdist
        run: python -m build
      - name: Install the wheel in a clean env and smoke-test
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/heel --version
          /tmp/v/bin/heel scenarios > /dev/null
          /tmp/v/bin/python -c "from heel.heldout_eval import heldout_eval; r=heldout_eval(); assert r['test']['with_semantic']['precision'] > 0.85; print('smoke OK', r['test']['with_semantic']['recall'])"
          # exercise the heel-mcp console script end-to-end (regression guard for the entry point)
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}\n' | /tmp/v/bin/heel-mcp | grep -q heel_run && echo "mcp entry OK"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  ui:
    name: control-room UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install + build (snapshot is committed, so this is a pure type/render check)
        working-directory: web
        run: |
          npm ci || npm install
          npm run build

  browser-alpha:
    name: anonymous browser security + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          # setup-node caches npm's download cache only, never app state or input.
          cache: npm
          cache-dependency-path: apps/heel-cloud/package-lock.json
      - name: Install pinned browser dependencies without lifecycle scripts
        working-directory: apps/heel-cloud
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check deterministic browser wheel and sample artifacts
        run: |
          python scripts/build_browser_engine.py --output apps/heel-cloud/browser-engine --check
          python scripts/build_browser_sample.py --check
      - name: Python browser, sample, and native/Pyodide parity gates
        run: >-
          python -m unittest
          tests.test_browser_engine_build
          tests.test_browser_review
          tests.test_browser_sample
          tests.test_browser_native_parity
          -v
      - name: Actual Pyodide wheel under Node 26 security confinement
        working-directory: apps/heel-cloud
        run: node --test tests/browser-engine.test.mjs
      - name: Application unit tests and static checks
        working-directory: apps/heel-cloud
        run: |
          npm run test:unit
          npm run typecheck
          npm run lint
      - name: Build Cloudflare-compatible production artifact
        working-directory: apps/heel-cloud
        run: npm run build
      - name: Inspect production privacy, product, and deployment artifact contracts
        working-directory: apps/heel-cloud
        run: >-
          node --test
          tests/privacy-boundary.test.mjs
          tests/rendered-html.test.mjs
          tests/production-artifact.test.mjs
