#
# Heel ingress-v1 reviewed template (H0B). One canonical public name H, one constant private
# control-plane backend, a management TLS listener for the trusted management peer only, and one
# runner TLS listener per slot. policy.js beside this file is the only request authority here.
#
# The trusted renderer (render_nginx_config in tests/support/host_ingress_harness.py) substitutes
# only the double-at-delimited tokens below, each from a closed grammar, and repeats the two SLOT
# sections once per registry slot. It never inserts directives. The rendered file carries the
# private edge secret: it is 0600 task-local state, never printed, uploaded or summarized.

worker_processes 1;
worker_rlimit_nofile 512;
daemon off;
master_process on;
pid @@STATE_DIR@@/nginx.pid;
# Request handling never logs: fixed counters in policy.js are the only diagnostics.
error_log /dev/null crit;
pcre_jit off;

events {
    worker_connections 128;
    multi_accept off;
}

http {
    access_log off;
    log_not_found off;
    log_subrequest off;
    server_tokens off;
    default_type application/octet-stream;
    types {}
    sendfile off;
    tcp_nopush off;
    # One request per connection: a second message on the same connection is never parsed.
    keepalive_timeout 0;
    keepalive_requests 1;
    reset_timedout_connection on;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    client_header_buffer_size 1k;
    large_client_header_buffers 8 1k;
    client_max_body_size 278528;
    client_body_buffer_size 288k;
    client_body_in_file_only off;
    client_body_in_single_buffer on;
    client_body_temp_path @@STATE_DIR@@/tmp/client_body 1;
    proxy_temp_path @@STATE_DIR@@/tmp/proxy 1;
    # Raw headers reach the policy unmodified so it can refuse them; nothing is silently dropped.
    ignore_invalid_headers off;
    underscores_in_headers on;
    merge_slashes off;
    max_ranges 0;
    server_name_in_redirect off;
    port_in_redirect off;
    absolute_redirect off;
    msie_padding off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    ssl_session_tickets off;
    ssl_certificate @@CERT_PATH@@;
    ssl_certificate_key @@KEY_PATH@@;

    js_engine qjs;
    js_context_reuse 0;
    js_path @@POLICY_DIR@@;
    js_import policy from policy.js;
    js_shared_dict_zone zone=heel_registry:1m type=number;
    js_shared_dict_zone zone=heel_counters:1m type=number;

    # Rendered constants (one declaration each).
    js_var $heel_public_host @@PUBLIC_HOST@@;
    js_var $heel_registry_path @@REGISTRY_PATH@@;
    js_var $heel_registry_owner @@REGISTRY_OWNER_UID@@;
    js_var $heel_boot_epoch @@BOOT_EPOCH@@;
    js_var $heel_backend @@BACKEND_ADDRESS@@:@@BACKEND_PORT@@;
    js_var $heel_management @@MANAGEMENT_ADDRESS@@:@@MANAGEMENT_PORT@@;
    js_var $heel_management_peer @@MANAGEMENT_PEER@@;
    js_var $heel_edge_secret @@EDGE_SECRET@@;

    # Per-request state written only by policy.js; empty until a handler sets it.
    js_var $heel_ok;
    js_var $heel_state;
    js_var $heel_t0;
    js_var $heel_gen;
    js_var $heel_up_path;
    js_var $heel_up_runner_id;
    js_var $heel_up_key_id;
    js_var $heel_up_timestamp;
    js_var $heel_up_nonce;
    js_var $heel_up_sequence;
    js_var $heel_up_signature;
    js_var $heel_m_edge;
    js_var $heel_m_cookie;
    js_var $heel_m_authorization;
    js_var $heel_m_origin;
    js_var $heel_m_internal_origin;
    js_var $heel_m_client_key;
    js_var $heel_m_idempotency;
    js_var $heel_m_generation;
    js_var $heel_m_content_type;
    js_var $heel_m_content_encoding;

    js_set $heel_dispatch_edge policy.dispatchGate nocache;
    js_set $heel_management_edge policy.managementEdge nocache;

    # Listener identity comes from the actual local socket, never from a request field.
    map "$server_addr:$server_port" $heel_listener {
        default "";
        "@@MANAGEMENT_ADDRESS@@:@@MANAGEMENT_PORT@@" "management";
        # BEGIN SLOT MAP
        "@@SLOT_ADDRESS@@:@@SLOT_PORT@@" "slot:@@SLOT_ID@@";
        # END SLOT MAP
    }

    limit_conn_zone $heel_listener zone=heel_listeners:1m;

    subrequest_output_buffer_size 256k;
    proxy_http_version 1.0;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_max_temp_file_size 0;
    proxy_request_buffering on;
    proxy_next_upstream off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_intercept_errors off;
    proxy_redirect off;
    proxy_pass_request_headers off;
    proxy_pass_request_body on;
    # Control-bearing upstream fields are never acted on (and are hidden by default).
    proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset Expires Cache-Control Set-Cookie Vary;

    # Missing or unknown SNI never completes a handshake on any listener; a request whose Host is not
    # H after a handshake for H lands here (nginx selects the server by Host) and is refused 421.
    server {
        listen @@MANAGEMENT_ADDRESS@@:@@MANAGEMENT_PORT@@ ssl default_server;
        ssl_reject_handshake on;
        location / {
            js_content policy.misdirected;
        }
    }

    server {
        listen @@MANAGEMENT_ADDRESS@@:@@MANAGEMENT_PORT@@ ssl;
        server_name @@PUBLIC_HOST@@;
        allow @@MANAGEMENT_PEER@@;
        deny all;
        limit_conn heel_listeners 32;

        location / {
            js_access policy.managementAccess;
            proxy_pass http://@@BACKEND_ADDRESS@@:@@BACKEND_PORT@@;
            proxy_set_header Host @@PUBLIC_HOST@@;
            proxy_set_header Connection close;
            proxy_set_header X-Heel-Edge-Auth $heel_management_edge;
            proxy_set_header Content-Type $heel_m_content_type;
            proxy_set_header Content-Encoding $heel_m_content_encoding;
            proxy_set_header Cookie $heel_m_cookie;
            proxy_set_header Authorization $heel_m_authorization;
            proxy_set_header Origin $heel_m_origin;
            proxy_set_header X-Heel-Internal-Origin $heel_m_internal_origin;
            proxy_set_header X-Heel-Client-Key $heel_m_client_key;
            proxy_set_header Idempotency-Key $heel_m_idempotency;
            proxy_set_header If-Heel-Control-Generation $heel_m_generation;
            proxy_set_header X-Heel-Runner-Id $heel_up_runner_id;
            proxy_set_header X-Heel-Runner-Key-Id $heel_up_key_id;
            proxy_set_header X-Heel-Runner-Timestamp-Ms $heel_up_timestamp;
            proxy_set_header X-Heel-Runner-Nonce $heel_up_nonce;
            proxy_set_header X-Heel-Runner-Sequence $heel_up_sequence;
            proxy_set_header X-Heel-Runner-Signature $heel_up_signature;
        }

        location /__heel_cp/ {
            internal;
            deny all;
        }
    }

    # BEGIN SLOT SERVER
    server {
        listen @@SLOT_ADDRESS@@:@@SLOT_PORT@@ ssl default_server;
        ssl_reject_handshake on;
        location / {
            js_content policy.misdirected;
        }
    }

    server {
        listen @@SLOT_ADDRESS@@:@@SLOT_PORT@@ ssl;
        server_name @@PUBLIC_HOST@@;
        allow @@SLOT_PEER@@;
        deny all;
        limit_conn heel_listeners 8;

        location / {
            js_access policy.runnerAccess;
            js_content policy.runnerContent;
        }

        # Reachable only as this server's own subrequest; the prefix is replaced by "/", so the
        # control plane receives the original /v1 bytes at the one literal backend address.
        location /__heel_cp/ {
            internal;
            proxy_pass http://@@BACKEND_ADDRESS@@:@@BACKEND_PORT@@/;
            proxy_set_header Host @@PUBLIC_HOST@@;
            proxy_set_header Connection close;
            proxy_set_header Content-Type application/json;
            proxy_set_header Content-Encoding identity;
            proxy_set_header X-Heel-Edge-Auth $heel_dispatch_edge;
            proxy_set_header X-Heel-Runner-Id $heel_up_runner_id;
            proxy_set_header X-Heel-Runner-Key-Id $heel_up_key_id;
            proxy_set_header X-Heel-Runner-Timestamp-Ms $heel_up_timestamp;
            proxy_set_header X-Heel-Runner-Nonce $heel_up_nonce;
            proxy_set_header X-Heel-Runner-Sequence $heel_up_sequence;
            proxy_set_header X-Heel-Runner-Signature $heel_up_signature;
        }
    }
    # END SLOT SERVER

    # Fixed-counter operational endpoint, bound to the ingress namespace's own loopback only.
    server {
        listen 127.0.0.1:@@OPS_PORT@@;
        allow 127.0.0.1;
        deny all;
        location = /__heel_counters {
            js_content policy.counters;
        }
        location / {
            deny all;
        }
    }
}
